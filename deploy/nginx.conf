# Moximos — Nginx site config for the Hostinger VPS.
#
# One origin serves both halves: the built frontend from disk, and the Node
# API under /api. That is deliberate — src/app/api.js falls back to relative
# "/api/..." paths when VITE_BASE_URL is unset, so same-origin means no CORS
# config, no VITE_BASE_URL, and the session cookie is a first-party cookie
# rather than a cross-site one (which browsers increasingly block).
#
# Install to /etc/nginx/sites-available/moximos, then:
#   ln -s /etc/nginx/sites-available/moximos /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name moximos.com www.moximos.com;

    # Certbot rewrites this block for HTTPS; until then it serves plain HTTP.
    root /var/www/moximos/dist;
    index index.html;

    # Generation legitimately takes minutes on a congested free tier — a
    # measured worst case was 727 seconds. Nginx's 60s default would cut the
    # connection mid-build and the UI would show a failure for a project that
    # was still being written.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 30s;

    client_max_body_size 20m;   # screenshot attachments; server caps JSON at 15mb

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;   # progress polling should not sit in a buffer
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # visitors keep loading the previous deploy's asset manifest.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA routing: anything that is not a real file resolves to index.html so
    # react-router can match the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
